<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Hub</title>
<style>
:root{--bg:#08080c;--card:#1b1b23;--card2:#25252f;--text:#f5f5fa;--muted:#9b9bab;--accent:#3e91ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"SamsungOne","Samsung Sharp Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{max-width:1000px;margin:0 auto;padding:56px 20px 6px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:2.8rem;font-weight:700;letter-spacing:-.03em}
header p{margin:6px 0 0;color:var(--muted)}
.me{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:8px 8px 8px 18px}
.me input{background:transparent;border:0;color:var(--text);font-size:1rem;width:130px;outline:none;font-family:inherit}
.controls{max-width:1000px;margin:14px auto;padding:0 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
input[type=search]{flex:1 1 240px;padding:15px 20px;border-radius:999px;border:0;background:var(--card);color:var(--text);font-size:1rem;outline:none;font-family:inherit}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{padding:11px 18px;border-radius:999px;border:0;background:var(--card);color:var(--text);cursor:pointer;font-size:.95rem;font-family:inherit}
.tabs button.on{background:var(--accent);color:#fff;font-weight:600}
.grid{max-width:1000px;margin:18px auto 60px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--card);border-radius:30px;padding:22px 10px 18px;text-align:center;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-4px);background:var(--card2)}
.ico{width:78px;height:78px;margin:0 auto 12px;border-radius:28px;display:grid;place-items:center;font-size:2.4rem;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.card h3{margin:0 0 3px;font-size:1rem;font-weight:600}
.card small{color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted)}
#overlay{display:none;position:fixed;inset:0;background:rgba(6,6,10,.94);z-index:10;padding:14px}
#overlay.open{display:flex;flex-direction:column}
#overlay.wide{padding:0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.bar strong{font-size:1.25rem;padding-left:8px}
.btn{padding:11px 20px;border:0;border-radius:999px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600;font-size:1rem;font-family:inherit}
.bar .btn{background:var(--card2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
#stage{flex:1;background:var(--card);border-radius:36px;overflow:auto;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;min-height:0}
#stage iframe{width:100%;height:100%;border:0;border-radius:24px}
.big{font-size:2.4rem;margin:10px 0}
.shop{display:flex;flex-direction:column;gap:8px;min-width:230px;text-align:left}
.shop .btn{text-align:left;background:var(--card2);color:var(--text)}
.shop .btn:not(:disabled){background:var(--accent);color:#fff}
.cookie{font-size:8rem;cursor:pointer;user-select:none;line-height:1;transition:transform .05s}
.cookie:active{transform:scale(.92)}
footer{text-align:center;color:var(--muted);padding:20px;font-size:.85rem}

.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:var(--card);border:0;color:var(--text);padding:12px 18px;border-radius:999px;font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit}
.pill:hover{background:var(--card2)}
#toasts{position:fixed;top:14px;right:14px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 28px))}
.toast{background:rgba(40,40,52,.96);backdrop-filter:blur(14px);border-radius:22px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .25s ease;font-size:.95rem}
@keyframes tin{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);padding:16px}
#modal.open{display:flex}
.sheet{position:relative;background:var(--card);border-radius:36px;padding:30px 26px 24px;width:min(420px,100%);max-height:92vh;overflow:auto;text-align:center}
.sheet.big{width:min(580px,100%)}
.sheet h2{margin:0 0 6px;font-size:1.5rem}
.sub,.tiny{color:var(--muted);font-size:.9rem}
.sheet input,.sheet select{width:100%;margin:6px 0;padding:15px 18px;border-radius:999px;border:0;background:var(--card2);color:var(--text);font-size:1rem;font-family:inherit;outline:none}
.btn.wide{width:100%;margin-top:10px}
.seg{display:flex;gap:6px;background:var(--card2);padding:5px;border-radius:999px;margin:10px 0}
.seg button{flex:1;border:0;border-radius:999px;padding:10px;background:transparent;color:var(--text);cursor:pointer;font-family:inherit;font-size:.9rem}
.seg button.on{background:var(--accent);font-weight:600}
.err{color:#ff7b7b;min-height:1.2em;margin:4px 0}
.admlink{position:absolute;top:14px;right:20px;background:transparent;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;font-family:inherit}
.rows{margin:10px 0;text-align:left}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:20px;background:var(--card2);margin-bottom:8px}
.row.me{outline:2px solid var(--accent)}
.row b{width:30px;text-align:center}.row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row em{font-style:normal;font-weight:700;color:var(--accent)}
.tut{max-width:420px}.tut p{color:var(--muted);line-height:1.55;margin:8px 0 18px}.tut .ico{margin-bottom:14px}
table.t{width:100%;border-collapse:collapse;font-size:.85rem;text-align:left}.t td,.t th{padding:8px;border-bottom:1px solid #333}
pre.j{text-align:left;font-size:.75rem;white-space:pre-wrap;word-break:break-all;background:#0c0f1a;padding:12px;border-radius:16px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<header>
  <div><h1>Arcade Hub</h1><p>Free browser games. No downloads.</p></div>
  <div class="pills">
    <button class="pill" id="moneyPill" onclick="openBoard('💰 Money')">💰 0</button>

<div class="controls">

<div class="grid" id="grid"></div>

<div id="overlay">

<div id="toasts"></div><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>

const HOW={
 "Snake Arena":"Steer with WASD (or the mouse). Eat glowing orbs to grow longer. Crash into another snake or the red wall and it's over. Hold Space or Shift to speed up, which costs a little length.",

};
const GRAD=['#ff6b6b,#ee5253','#feca57,#ff9f43','#1dd1a1,#10ac84','#48dbfb,#0abde3','#a29bfe,#6c5ce7','#ff9ff3,#f368e0','#54a0ff,#2e86de','#00d2d3,#01a3a4'];

/* ===== ONLINE SETUP: paste your two Firebase values here (see setup notes) ===== */
const FB={url:'',key:''}; // url = Realtime Database URL, key = Web API key
const ADMIN_USER='lunarsage';

let activeCat='All',timers=[],stops=[],curGame='',curObj=null,A=null,P=null,cs;
try{A=JSON.parse(localStorage.getItem('ah_auth')||'null');}catch(e){}
const grid=document.getElementById('grid'),searchBox=document.getElementById('search'),tabs=document.getElementById('tabs'),
      overlay=document.getElementById('overlay'),stage=document.getElementById('stage');
const rnd=(a,b)=>a+Math.random()*(b-a);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=n=>String(n||'').replace(/[<>&"']/g,'').trim().slice(0,14);
const online=()=>!!(FB.url&&FB.key);
const emailOf=n=>String(n).toLowerCase()+'@arcadehub.game';
const newP=()=>({name:'',money:0,seen:{},best:{}});
const ckSet=(k,v)=>{document.cookie=k+'='+encodeURIComponent(v)+';max-age=31536000;path=/;SameSite=Lax';};
const ckGet=k=>{const m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));return m?decodeURIComponent(m[1]):null;};
try{P=JSON.parse(localStorage.getItem('ah_profile')||ckGet('ah')||'null');}catch(e){}
if(P&&P.name)P={...newP(),...P};else P=null;
const myName=()=>(P&&P.name)||'Player';

/* ----- profile saving (browser storage + cookie + cloud backup) ----- */
function refreshHeader(){if(!P)return;document.getElementById('moneyPill').textContent='💰 '+P.money;document.getElementById('who').textContent='👤 '+P.name;}
function saveP(){
  if(!P)return;
  try{localStorage.setItem('ah_profile',JSON.stringify(P));}catch(e){}
  ckSet('ah',JSON.stringify({name:P.name,money:P.money,seen:P.seen}));
  refreshHeader();cloudSoon();
}
function cloudSoon(){
  if(!online()||!A||!P)return;
  clearTimeout(cs);
  cs=setTimeout(async()=>{try{
    await db('PUT','users/'+A.uid,{name:P.name,money:P.money,t:Date.now(),data:JSON.stringify({P,bakery:localStorage.getItem('bakery')})});
    await db('PUT','money/'+A.uid,{name:P.name,money:P.money});
  }catch(e){}},3000);
}

/* ----- tiny UI helpers ----- */
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),6500);}
function modal(html){const m=document.getElementById('modal');m.innerHTML=html;m.classList.add('open');return m;}
function closeModal(){const m=document.getElementById('modal');m.classList.remove('open');m.innerHTML='';m.onkeydown=null;}

/* ----- Firebase REST client ----- */
async function idp(path,body){
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+path+'?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,returnSecureToken:true})});
  const d=await r.json();if(d.error)throw new Error(d.error.message);return d;
}
function setAuth(d,anon){
  A={uid:d.localId,token:d.idToken,refresh:d.refreshToken,exp:Date.now()+(+d.expiresIn-120)*1000,anon:!!anon,email:d.email||''};
  try{localStorage.setItem('ah_auth',JSON.stringify(A));}catch(e){}
}
async function token(){
  if(!A){setAuth(await idp('signUp',{}),true);return A.token;}
  if(Date.now()>A.exp){
    const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(A.refresh)});
    const d=await r.json();
    if(d.error){A=null;try{localStorage.removeItem('ah_auth');}catch(e){}return token();}
    A.token=d.id_token;A.refresh=d.refresh_token;A.exp=Date.now()+(+d.expires_in-120)*1000;
    try{localStorage.setItem('ah_auth',JSON.stringify(A));}catch(e){}
  }
  return A.token;
}
async function db(method,path,body,q){
  const t=await token();
  const r=await fetch(`${FB.url.replace(/\/$/,'')}/${path}.json?auth=${t}${q?'&'+q:''}`,{method,body:body==null?undefined:JSON.stringify(body)});
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((d&&d.error)||('HTTP '+r.status));
  return d;
}
const friendly=e=>{const m=String(e.message||e);
  return /EMAIL_EXISTS/.test(m)?'That username is taken.':/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)?'Wrong username or password.':/WEAK/.test(m)?'Password must be 6+ characters.':/TOO_MANY/.test(m)?'Too many tries. Wait a bit and retry.':m;};
function logName(n,type){if(online())db('POST','log',{name:n,type,t:Date.now()}).catch(()=>{});}

/* ----- names, accounts, welcome screen ----- */
async function doAuth(mode,name,pw){
  if(mode==='g'){
    name=clean(name)||'Player'+(Math.random()*900+100|0);
    P={...newP(),...(P||{}),name};saveP();logName(name,'guest');return;
  }
  if(!/^[A-Za-z0-9_]{3,14}$/.test(name))throw new Error('Username: 3-14 letters, numbers or _');
  if(name.toLowerCase()===ADMIN_USER)throw new Error('That username is reserved.');
  if(pw.length<6)throw new Error('Password must be 6+ characters.');
  if(mode==='c'){
    setAuth(await idp('signUp',{email:emailOf(name),password:pw}),false);
    P={...newP(),...(P||{}),name};saveP();logName(name,'signup');
  }else{
    setAuth(await idp('signInWithPassword',{email:emailOf(name),password:pw}),false);
    const u=await db('GET','users/'+A.uid).catch(()=>null);
    P={...newP(),name};
    if(u&&u.data){try{const b=JSON.parse(u.data);P={...newP(),...b.P};if(b.bakery)localStorage.setItem('bakery',b.bakery);}catch(e){}}
    P.name=(u&&u.name)||name;saveP();logName(P.name,'login');
  }
}
function openWelcome(){
  let mode='g';
  const m=modal(`<div class="sheet"><button class="admlink" id="adm">Admin</button><h2>Welcome to Arcade Hub 👋</h2><p class="sub">Choose your name for the leaderboards.</p>
  ${online()?'<div class="seg"><button data-m="g" class="on">Guest</button><button data-m="i">Sign in</button><button data-m="c">Create account</button></div>':''}
  <input id="un" maxlength="14" placeholder="Your name" autocomplete="username" value="${esc(P&&P.name||'')}">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="display:none">
  <p class="err" id="err"></p><button class="btn wide" id="ok">Let's play</button>
  <p class="tiny">${online()?'Accounts back up your money and progress so you can sign in anywhere.':''}</p></div>`);
  const $=q=>m.querySelector(q);
  m.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    mode=b.dataset.m;m.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));
    $('#pw').style.display=mode==='g'?'none':'';$('#ok').textContent=mode==='g'?"Let's play":mode==='i'?'Sign in':'Create account';});
  $('#ok').onclick=async()=>{
    $('#err').textContent='';$('#ok').disabled=true;
    try{await doAuth(mode,$('#un').value.trim(),$('#pw').value);closeModal();}catch(e){$('#err').textContent=friendly(e);}
    $('#ok').disabled=false;};
  m.onkeydown=e=>{if(e.key==='Enter')$('#ok').click();};
  $('#adm').onclick=openAdminLogin;
  $('#un').focus();
}
function openAccount(){
  if(A&&!A.anon&&P){
    const m=modal(`<div class="sheet"><h2>👤 ${esc(P.name)}</h2><p class="sub">Signed in. Your progress is backed up.</p><p>💰 ${P.money}</p><button class="btn wide" id="so">Sign out</button><button class="btn wide" style="background:var(--card2)" onclick="closeModal()">Close</button></div>`);
    m.querySelector('#so').onclick=signOut;
  }else openWelcome();
}
function signOut(){
  A=null;P=null;
  try{['ah_auth','ah_profile','bakery'].forEach(k=>localStorage.removeItem(k));}catch(e){}
  ckSet('ah','');closeModal();openWelcome();
}

/* ----- admin ----- */
function openAdminLogin(){
  const m=modal(`<div class="sheet"><h2>🔐 Admin</h2><input id="au" placeholder="Admin username" autocomplete="username"><input id="ap" type="password" placeholder="Password" autocomplete="current-password"><p class="err" id="err"></p><button class="btn wide" id="ok">Log in</button><button class="btn wide" style="background:var(--card2)" id="bk">Back</button></div>`);
  const $=q=>m.querySelector(q);
  $('#ok').onclick=async()=>{
    $('#err').textContent='';$('#ok').disabled=true;
    try{
      if(!online())throw new Error('Set up Firebase first (see setup notes).');
      if($('#au').value.trim().toLowerCase()!==ADMIN_USER)throw new Error('Wrong username or password.');
      setAuth(await idp('signInWithPassword',{email:emailOf(ADMIN_USER),password:$('#ap').value}),false);
      await openAdmin();
    }catch(e){$('#err').textContent=friendly(e);}
    $('#ok').disabled=false;};
  m.onkeydown=e=>{if(e.key==='Enter')$('#ok').click();};
  $('#bk').onclick=()=>P?closeModal():openWelcome();
}
async function openAdmin(){
  const m=modal('<div class="sheet big"><h2>🛠 Admin</h2><p class="sub">Loading...</p></div>');
  try{
    const [log,users]=await Promise.all([db('GET','log',null,'orderBy="$key"&limitToLast=300'),db('GET','users')]);
    const L=Object.values(log||{}).sort((a,b)=>b.t-a.t),U=Object.entries(users||{}).sort((a,b)=>(b[1].money||0)-(a[1].money||0));
    const when=t=>t?new Date(t).toLocaleString():'';

/* ----- leaderboards, money, notifications ----- */
async function submitScore(score){
  score=Math.floor(score);const g=curGame;
  if(!P||!(score>0)||!g)return;
  const old=P.best[g]||0;
  if(score<=old){toast('Score '+score+'. Your best is '+old+'.');return;}
  P.best[g]=score;let earned=old?0:10,passed=[];
  if(online()){
    try{
      const top=await db('GET','lb/'+encodeURIComponent(g),null,'orderBy="score"&limitToLast=100')||{};
      passed=Object.entries(top).filter(([id,r])=>id!==A.uid&&r.score>=old&&r.score<score).sort((a,b)=>b[1].score-a[1].score).slice(0,10);
      await db('PUT','lb/'+encodeURIComponent(g)+'/'+A.uid,{name:P.name,score,t:Date.now()});
      earned+=passed.length*25;
      passed.forEach(([id])=>db('POST','notif/'+id,{from:P.name,game:g,score,t:Date.now()}).catch(()=>{}));
    }catch(e){passed=[];}
  }
  P.money+=earned;saveP();
  toast(passed.length?'🏆 New best '+score+'! You passed '+passed.length+' player'+(passed.length>1?'s':'')+'. +💰'+earned:'🏆 New best '+score+'!'+(earned?' +💰'+earned:''));
}
async function pollNotifs(){
  if(!online()||!P)return;
  try{
    await token();const n=await db('GET','notif/'+A.uid);if(!n)return;
    for(const [id,r] of Object.entries(n)){
      toast('🔔 '+r.from+' passed your '+r.game+' score with '+r.score+'!');
      db('DELETE','notif/'+A.uid+'/'+id).catch(()=>{});
    }
  }catch(e){}
}
async function boardRows(sel){
  const money=sel==='💰 Money',mine=()=>P?[{id:'me',name:P.name,v:money?P.money:(P.best[sel]||0)}].filter(r=>money||r.v>0):[];
  let rows=[];
  try{
    if(online()){
      const d=await db('GET',money?'money':'lb/'+encodeURIComponent(sel),null,money?'orderBy="money"&limitToLast=10':'orderBy="score"&limitToLast=10')||{};
      rows=Object.entries(d).map(([id,r])=>({id,name:r.name,v:money?r.money:r.score}));
    }else rows=mine();
  }catch(e){rows=mine();}
  return rows.sort((a,b)=>b.v-a.v).slice(0,10);
}
async function openBoard(sel){
  sel=sel||curGame||GAMES[0].title;
  const m=modal(`<div class="sheet big"><h2>🏆 Leaderboards</h2><select id="bsel">${[...GAMES.map(g=>g.title),'💰 Money'].map(t=>`<option${t===sel?' selected':''}>${esc(t)}</option>`).join('')}</select><div class="rows" id="br"></div><button class="btn wide" onclick="closeModal()">Close</button></div>`);
  const load=async()=>{
    const v=m.querySelector('#bsel').value,br=m.querySelector('#br');br.textContent='Loading...';
    const rows=await boardRows(v);
    br.innerHTML=rows.length?rows.map((r,i)=>`<div class="row${r.id==='me'||(A&&r.id===A.uid)?' me':''}"><b>${['🥇','🥈','🥉'][i]||i+1}</b><span>${esc(r.name)}</span><em>${v==='💰 Money'?'💰 ':''}${esc(r.v)}</em></div>`).join(''):'<p class="sub">No scores yet. Be the first!</p>';};
  m.querySelector('#bsel').onchange=load;load();
}

function launch(g){
  stage.innerHTML='';
  if(g.src){const f=document.createElement('iframe');f.src=g.src;f.allowFullscreen=true;stage.appendChild(f);}
  else g.play(stage);

function openGame(g){
  if(!P){openWelcome();return;}

function cleanup(){timers.forEach(clearInterval);stops.forEach(f=>f());timers=[];stops=[];}
function retryGame(){if(!curObj)return;cleanup();launch(curObj);}

const dirX=()=>((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),
      dirY=()=>((keys.KeyS||keys.ArrowDown)?1:0)-((keys.KeyW||keys.ArrowUp)?1:0);

/* ===== SNAKE ARENA (slither-style, vs bots) ===== */
function slither(el){
  const W=Math.min(900,el.clientWidth-32), H=Math.max(300,el.clientHeight-32), WORLD=2400, SP=7;
  el.innerHTML='';
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  cv.style.cssText='width:min(100%,calc((100vh - 110px)*'+(W/H)+'));aspect-ratio:'+W+'/'+H+';border-radius:24px;background:#0b1220;touch-action:none';
  el.appendChild(cv);const g=cv.getContext('2d');
  const cols=['#f87171','#fb923c','#facc15','#4ade80','#22d3ee','#818cf8','#e879f9','#f472b6'];
  let foods=[],snakes=[],me,mx=W,my=H/2,boost=false,dead=false,raf,run=true,best=10,um=false;
  const addFood=(x,y,v,c)=>foods.push({x,y,v:v||1,c:c||cols[Math.random()*8|0]});
  for(let i=0;i<320;i++)addFood(rnd(40,WORLD-40),rnd(40,WORLD-40));
  function mk(bot){
    const x=rnd(300,WORLD-300),y=rnd(300,WORLD-300),a=rnd(0,6.28);
    const s={bot,name:bot?['Nova','Pixel','Blaze','Echo','Zip','Mango','Rex','Luna','Orbit','Ziggy','Kiwi','Bolt'][Math.random()*12|0]:myName(),ang:a,seg:[],pend:0,col:cols[Math.random()*8|0],fc:0,t:rnd(0,9)};
    for(let i=0;i<10;i++)s.seg.push({x:x-Math.cos(a)*i*SP,y:y-Math.sin(a)*i*SP});
    return s;
  }
  const rad=s=>Math.min(18,7+s.seg.length*0.03);
  function reset(){me=mk(false);snakes=[me];for(let i=0;i<12;i++)snakes.push(mk(true));dead=false;}
  reset();
  function die(s){
    for(let i=0;i<s.seg.length;i+=2)addFood(s.seg[i].x+rnd(-6,6),s.seg[i].y+rnd(-6,6),2,s.col);
    if(s===me){dead=true;submitScore(s.seg.length);snakes=snakes.filter(x=>x!==s);}
    else snakes[snakes.indexOf(s)]=mk(true);
  }
  function step(s){
    const h=s.seg[0];let ta;
    if(s.bot){
      let bf=null,bd=260*260;
      for(const f of foods){const d=(f.x-h.x)**2+(f.y-h.y)**2;if(d<bd){bd=d;bf=f;}}
      s.t+=.03;
      ta=bf?Math.atan2(bf.y-h.y,bf.x-h.x):s.ang+Math.sin(s.t)*.6;
      if(h.x<160||h.x>WORLD-160||h.y<160||h.y>WORLD-160)ta=Math.atan2(WORLD/2-h.y,WORLD/2-h.x);
    } else ta=(dirX()||dirY())?(um=false,Math.atan2(dirY(),dirX())):(um?Math.atan2(my-H/2,mx-W/2):s.ang);
    const diff=((ta-s.ang+Math.PI*3)%(Math.PI*2))-Math.PI;
    s.ang+=Math.max(-.12,Math.min(.12,diff));
    const boosting=!s.bot&&boost&&s.seg.length>12;
    const sp=boosting?4.6:2.7;
    if(boosting&&++s.fc%8===0){const t=s.seg.pop();addFood(t.x,t.y,1,s.col);}
    h.x+=Math.cos(s.ang)*sp;h.y+=Math.sin(s.ang)*sp;
    for(let i=1;i<s.seg.length;i++){
      const p=s.seg[i-1],q=s.seg[i],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;
      if(d>SP){q.x=p.x-dx/d*SP;q.y=p.y-dy/d*SP;}
    }
    const r=rad(s)+8;
    foods=foods.filter(f=>{if((f.x-h.x)**2+(f.y-h.y)**2<r*r){s.pend+=f.v*.5;return false;}return true;});
    while(s.pend>=1){const t=s.seg[s.seg.length-1];s.seg.push({x:t.x,y:t.y});s.pend--;}
  }
  function loop(){
    if(!run)return;
    [...snakes].forEach(step);
    for(const s of [...snakes]){
      const h=s.seg[0];
      if(h.x<0||h.y<0||h.x>WORLD||h.y>WORLD){die(s);continue;}
      for(const o of snakes){
        if(o===s)continue;
        const lim=rad(o)+rad(s)*.6;let hit=false;
        for(let i=0;i<o.seg.length;i+=2){const p=o.seg[i];if((p.x-h.x)**2+(p.y-h.y)**2<lim*lim){hit=true;break;}}
        if(hit){die(s);break;}
      }
    }
    while(foods.length<320)addFood(rnd(40,WORLD-40),rnd(40,WORLD-40));
    best=Math.max(best,me.seg.length);
    draw();raf=requestAnimationFrame(loop);
  }
  function draw(){
    const hd=me.seg[0],cx=hd.x-W/2,cy=hd.y-H/2;
    g.clearRect(0,0,W,H);
    g.fillStyle='#1e293b';
    for(let x=-(cx%60);x<W;x+=60)for(let y=-(cy%60);y<H;y+=60)g.fillRect(x,y,3,3);
    g.strokeStyle='#ef4444';g.lineWidth=4;g.strokeRect(-cx,-cy,WORLD,WORLD);
    for(const f of foods){const x=f.x-cx,y=f.y-cy;if(x<-10||y<-10||x>W+10||y>H+10)continue;
      g.fillStyle=f.c;g.beginPath();g.arc(x,y,3+f.v*1.5,0,7);g.fill();}
    for(const s of snakes){
      const r=rad(s);
      for(let i=s.seg.length-1;i>=0;i--){
        const x=s.seg[i].x-cx,y=s.seg[i].y-cy;if(x<-30||y<-30||x>W+30||y>H+30)continue;
        g.fillStyle=s.col;g.globalAlpha=i%2?.85:1;g.beginPath();g.arc(x,y,r,0,7);g.fill();
      }
      g.globalAlpha=1;
      const hx=s.seg[0].x-cx,hy=s.seg[0].y-cy;
      g.fillStyle='#fff';
      for(const o of[-.6,.6]){g.beginPath();g.arc(hx+Math.cos(s.ang+o)*r*.6,hy+Math.sin(s.ang+o)*r*.6,r*.3,0,7);g.fill();}
      g.font='12px system-ui';g.textAlign='center';g.fillText(s.name,hx,hy-r-6);g.textAlign='left';
    }
    g.fillStyle='#fff';g.font='bold 16px system-ui';g.textAlign='left';
    g.fillText('Length: '+(dead?0:me.seg.length)+'   Best: '+best,12,24);
    g.font='12px system-ui';g.fillStyle='#94a3b8';g.fillText('Move: WASD or mouse   Boost: Space / Shift',12,H-12);
    if(dead){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';
      g.font='bold 32px system-ui';g.fillText('You crashed!',W/2,H/2-10);g.font='18px system-ui';g.fillText('Click to play again',W/2,H/2+24);}
  }
  const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;mx=(t.clientX-r.left)*W/r.width;my=(t.clientY-r.top)*H/r.height;};
  cv.onmousemove=e=>{pos(e);um=true;};cv.ontouchmove=e=>{e.preventDefault();pos(e);};
  cv.onmousedown=e=>{if(dead){reset();return;}boost=true;};cv.onmouseup=()=>boost=false;
  cv.ontouchstart=e=>{pos(e);if(dead)reset();};
  const kd=e=>{if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight'){boost=true;e.preventDefault();}},ku=e=>{if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight')boost=false;};
  document.addEventListener('keydown',kd);document.addEventListener('keyup',ku);
  stops.push(()=>{run=false;cancelAnimationFrame(raf);document.removeEventListener('keydown',kd);document.removeEventListener('keyup',ku);});
  loop();
}

/* ===== BAKERY CLICKER (idle) ===== */
function clicker(el){
  let S={c:0,cp:1,own:{cur:0,gran:0,farm:0,fac:0}};
  try{const d=JSON.parse(localStorage.getItem('bakery'));if(d)S=Object.assign(S,d);}catch(e){}
  const U=[{k:'cur',n:'🖱️ Auto Clicker',b:15,r:.2},{k:'gran',n:'👵 Grandma',b:100,r:1},
           {k:'farm',n:'🌾 Farm',b:1100,r:8},{k:'fac',n:'🏭 Factory',b:12000,r:47}];
  const cost=u=>Math.ceil(u.b*Math.pow(1.15,S.own[u.k])),cpCost=()=>Math.ceil(50*Math.pow(2.2,S.cp-1));
  const cps=()=>U.reduce((a,u)=>a+u.r*S.own[u.k],0);
  const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n).toLocaleString();
  el.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:30px;align-items:center;justify-content:center">
    <div><div class="big">🍪 <span id="c">0</span></div><div style="color:#94a3b8">per second: <b id="ps">0</b></div>
    <div class="cookie" id="ck">🍪</div><p style="color:#94a3b8">per click: <b id="pc">1</b></p></div>
    <div class="shop" id="shop"></div></div>`;
  const $=id=>el.querySelector('#'+id),shop=$('shop');
  const btns=U.map(u=>{const b=document.createElement('button');b.className='btn';
    b.onclick=()=>{if(S.c>=cost(u)){S.c-=cost(u);S.own[u.k]++;upd();}};shop.appendChild(b);return b;});
  const cb=document.createElement('button');cb.className='btn';
  cb.onclick=()=>{if(S.c>=cpCost()){S.c-=cpCost();S.cp++;upd();}};shop.appendChild(cb);
  const rb=document.createElement('button');rb.className='btn';rb.style.cssText='background:#7f1d1d;color:#fff';rb.textContent='Reset progress';
  rb.onclick=()=>{if(confirm('Reset everything?')){S={c:0,cp:1,own:{cur:0,gran:0,farm:0,fac:0}};upd();}};shop.appendChild(rb);
  function upd(){
    $('c').textContent=fmt(S.c);$('ps').textContent=cps().toFixed(1);$('pc').textContent=S.cp;
    U.forEach((u,i)=>{btns[i].textContent=`${u.n} (${S.own[u.k]}) — ${fmt(cost(u))} 🍪  +${u.r}/s`;btns[i].disabled=S.c<cost(u);});
    cb.textContent=`👆 Stronger Clicks (x${S.cp}) — ${fmt(cpCost())} 🍪`;cb.disabled=S.c<cpCost();
  }
  $('ck').onclick=()=>{S.c+=S.cp;upd();};
  timers.push(setInterval(()=>{S.c+=cps()/10;upd();},100));
  timers.push(setInterval(()=>{try{localStorage.setItem('bakery',JSON.stringify(S));}catch(e){}},4000));
  stops.push(()=>{try{localStorage.setItem('bakery',JSON.stringify(S));}catch(e){}});
  upd();
}

/* ===== ARCHER DUEL (drag to aim, release to shoot) ===== */
function archer(el){
  const W=800,H=400,GY=340,G=.25;
  el.innerHTML='';
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  cv.style.cssText='width:min(100%,calc((100vh - 110px)*2));border-radius:24px;background:linear-gradient(#7dd3fc,#e0f2fe);touch-action:none;cursor:crosshair';
  el.appendChild(cv);const g=cv.getContext('2d');
  let kills=0,P,E,arrows=[],drag=null,msg='',over=false,eT=90,cd=0,raf,run=true,mouse={x:0,y:0},flash=0;
  function newRound(){P={x:80,hp:100,dead:false};E={x:rnd(450,730),hp:100,dead:false};arrows=[];over=false;msg='';eT=90;cd=0;}
  newRound();
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};};
  function vec(){const dx=drag.sx-mouse.x,dy=drag.sy-mouse.y,m=Math.hypot(dx,dy)||1,k=Math.min(m*.12,17)/m;return{vx:dx*k,vy:dy*k};}
  cv.onpointerdown=e=>{const p=pos(e);mouse=p;
    if(over){if(P.dead)kills=0;newRound();return;}
    if(!P.dead)drag={sx:p.x,sy:p.y};};
  cv.onpointermove=e=>{mouse=pos(e);};
  cv.onpointerup=()=>{
    if(drag&&!over&&cd<=0){const v=vec();if(Math.hypot(v.vx,v.vy)>2){arrows.push({x:P.x+16,y:GY-52,vx:v.vx,vy:v.vy,from:'p'});cd=35;}}
    drag=null;};
  function eFire(){
    const bx=E.x-16,by=GY-52,tx=P.x+rnd(-1,1)*Math.max(15,90-kills*12);let ba=.8,be=1e9;
    for(let a=.1;a<1.4;a+=.02){let x=bx,y=by,vx=-16*Math.cos(a),vy=-16*Math.sin(a);
      for(let i=0;i<300&&y<GY-20;i++){vy+=G;x+=vx;y+=vy;}
      const er=Math.abs(x-tx);if(er<be){be=er;ba=a;}}
    arrows.push({x:bx,y:by,vx:-16*Math.cos(ba),vy:-16*Math.sin(ba),from:'e'});
  }
  function update(){
    if(cd>0)cd--;if(flash>0)flash--;
    if(!over&&!E.dead&&!P.dead&&--eT<=0){eT=rnd(110,170)-Math.min(kills*8,60);eFire();}
    for(const a of arrows){
      if(a.stuck)continue;
      a.vy+=G;a.x+=a.vx;a.y+=a.vy;
      if(a.y>=GY||a.x<-50||a.x>W+50){a.stuck=true;continue;}
      const t=a.from==='p'?E:P;if(t.dead)continue;
      let dmg=0;
      if(Math.hypot(a.x-t.x,a.y-(GY-62))<14){dmg=50;msg='HEADSHOT!';flash=50;}
      else if(Math.abs(a.x-t.x)<10&&a.y>GY-52&&a.y<GY)dmg=20;
      if(dmg){a.stuck=true;t.hp-=dmg;
        if(t.hp<=0){t.dead=true;over=true;if(t===E){kills++;msg='You win! Click for the next round';}else{msg='You lost! Click to restart';if(kills>0)submitScore(kills);}}}
    }
  }
  function fig(x,dir,t,col){
    g.save();g.translate(x,GY);if(t.dead)g.rotate(-dir*1.45);
    g.strokeStyle=col;g.fillStyle=col;g.lineWidth=5;g.lineCap='round';
    g.beginPath();g.arc(0,-62,11,0,7);g.fill();
    g.beginPath();g.moveTo(0,-51);g.lineTo(0,-22);g.moveTo(0,-22);g.lineTo(-9,0);g.moveTo(0,-22);g.lineTo(9,0);
    g.moveTo(0,-44);g.lineTo(dir*16,-52);g.stroke();
    if(!t.dead){g.lineWidth=3;g.beginPath();g.moveTo(dir*16,-72);g.quadraticCurveTo(dir*36,-52,dir*16,-32);g.stroke();
      g.lineWidth=1;g.beginPath();g.moveTo(dir*16,-72);g.lineTo(dir*16,-32);g.stroke();}
    g.restore();
  }
  function bar(x,hp,nm){g.fillStyle='#0f172a';g.font='bold 13px system-ui';g.textAlign='center';g.fillText(nm,x,GY-102);g.textAlign='left';g.fillStyle='#0003';g.fillRect(x-30,GY-95,60,8);g.fillStyle=hp>30?'#22c55e':'#ef4444';g.fillRect(x-30,GY-95,Math.max(0,hp)*.6,8);}
  function draw(){
    g.clearRect(0,0,W,H);
    g.fillStyle='#65a30d';g.fillRect(0,GY,W,H-GY);g.fillStyle='#4d7c0f';g.fillRect(0,GY,W,6);
    fig(P.x,1,P,'#1d4ed8');fig(E.x,-1,E,'#b91c1c');
    if(!P.dead)bar(P.x,P.hp,myName());if(!E.dead)bar(E.x,E.hp,'Bot '+(kills+1));
    g.strokeStyle='#78350f';g.lineWidth=3;
    for(const a of arrows){const m=Math.hypot(a.vx,a.vy)||1,ex=a.x-a.vx/m*22,ey=a.y-a.vy/m*22;
      g.beginPath();g.moveTo(ex,ey);g.lineTo(a.x,a.y);g.stroke();}
    if(drag&&!over){
      const v=vec();let x=P.x+16,y=GY-52,vx=v.vx,vy=v.vy;g.fillStyle='#0008';
      for(let i=0;i<60;i++){vy+=G;x+=vx;y+=vy;if(y>GY)break;if(i%3===0){g.beginPath();g.arc(x,y,2.5,0,7);g.fill();}}
    }
    g.fillStyle='#0f172a';g.font='bold 18px system-ui';g.textAlign='left';g.fillText('Wins: '+kills,12,26);
    if(cd>0&&!over){g.fillStyle='#0003';g.fillRect(12,34,70,6);g.fillStyle='#0f172a';g.fillRect(12,34,70*(1-cd/35),6);}
    g.font='12px system-ui';g.textAlign='right';g.fillText('Drag back and release to shoot. Headshots do double damage.',W-12,22);
    if(msg){g.textAlign='center';g.font='bold 30px system-ui';g.fillStyle='#0f172a';g.fillText(msg,W/2,110);}
  }
  function loop(){if(!run)return;update();draw();raf=requestAnimationFrame(loop);}
  stops.push(()=>{run=false;cancelAnimationFrame(raf);});
  loop();
}

/* ===== TILE HOP (A/D move, W bigger jump) ===== */
function hopper(el){
  const [c,g]=mkCanvas(el,420,600);
  const TY={n:{c:'#4ade80',l:'Normal'},b:{c:'#38bdf8',l:'Bounce: super jump'},c:{c:'#b45309',l:'Crumble: breaks'},m:{c:'#a78bfa',l:'Moving'},s:{c:'#f43f5e',l:'Spike: deadly'}};
  let p={x:210,y:500,vy:-11,f:1},plats=[],best=0,dead=false;
  const mk=(y,h)=>{const r=Math.random(),k=r<.5?'n':r<.65?'b':r<.8?'c':r<.92?'m':(h>20?'s':'n');
    return{x:rnd(0,340),y,k,dx:k==='m'?rnd(1,2)*(Math.random()<.5?-1:1):0,gone:0};};
  for(let i=0;i<9;i++)plats.push({x:rnd(0,340),y:600-i*68,k:'n',dx:0,gone:0});plats[0].x=170;
  loopGame(()=>{
    const gr=g.createLinearGradient(0,0,0,600);gr.addColorStop(0,'#1e1b4b');gr.addColorStop(1,'#0c0f1a');g.fillStyle=gr;g.fillRect(0,0,420,600);
    if(!dead){
      p.x+=dirX()*5.2;if(dirX())p.f=dirX();if(p.x<0)p.x=420;if(p.x>420)p.x=0;
      p.vy+=.45;p.y+=p.vy;
      plats.forEach(q=>{if(q.k==='m'){q.x+=q.dx;if(q.x<0||q.x>340)q.dx*=-1;}});
      if(p.vy>0)for(const q of plats){
        if(q.gone)continue;

      }
      if(p.y<240){const d=240-p.y;p.y=240;plats.forEach(q=>q.y+=d);best+=d;}
      plats=plats.filter(q=>q.y<620);
      while(plats.length<10)plats.push(mk(Math.min(...plats.map(q=>q.y))-rnd(55,78+Math.min(best/50,24)),best/10));
      if(p.y>610&&!dead){dead=true;submitScore(best/10);}
    }
    plats.forEach(q=>{
      if(q.gone)return;
      g.fillStyle=TY[q.k].c;g.beginPath();g.roundRect(q.x,q.y,80,12,6);g.fill();
      if(q.k==='b'){g.fillStyle='#e0f2fe';g.fillRect(q.x+28,q.y-5,24,5);}
      if(q.k==='s'){g.fillStyle='#fff';for(let i=0;i<4;i++){g.beginPath();g.moveTo(q.x+8+i*20,q.y);g.lineTo(q.x+18+i*20,q.y-10);g.lineTo(q.x+28+i*20,q.y);g.fill();}}
    });
    g.fillStyle='#facc15';g.beginPath();g.arc(p.x,p.y-12,13,0,7);g.fill();
    g.fillStyle='#111';g.beginPath();g.arc(p.x+p.f*4,p.y-14,3,0,7);g.fill();
    g.font='bold 16px system-ui';g.fillStyle='#fff';g.fillText('Height '+Math.floor(best/10),12,24);
    g.font='11px system-ui';
    Object.values(TY).forEach((t,i)=>{g.fillStyle=t.c;g.fillRect(12,36+i*16,10,10);g.fillStyle='#cbd5e1';g.fillText(t.l,28,45+i*16);});
    if(dead)banner(g,'You fell! Close and reopen to retry',420,600);
  });
}

/* ===== ONLINE PONG (2 players, W/S, peer-to-peer) ===== */
function onlinePong(el){
  el.innerHTML=`<div><h2>🌐 Online Pong</h2><p style="max-width:430px">Player 1 clicks <b>Host</b> and shares the room code. Player 2 types it in and clicks <b>Join</b>. W/S moves your paddle. First to 7 wins.</p>
  <button class="btn" id="h">Host a game</button> <input id="code" maxlength="4" placeholder="CODE" style="padding:10px;border-radius:10px;border:2px solid #475569;background:#0f172a;color:#fff;width:90px;text-transform:uppercase"> <button class="btn" id="j">Join</button>
  <p id="st" style="color:#94a3b8"></p><div id="cv"></div></div>`;
  const $=i=>el.querySelector('#'+i);
  if(typeof Peer==='undefined'){$('st').textContent='The multiplayer library did not load. Check your connection.';return;}
  let peer,conn,host=false,in2=0,started=false;
  const S={bx:300,by:200,bvx:4,bvy:2,p1:160,p2:160,s1:0,s2:0,n1:'',n2:''};
  stops.push(()=>{try{peer&&peer.destroy();}catch(e){}});
  const onData=d=>{if(host&&d.t==='i'){in2=d.d;S.n2=d.n||'Guest';}else if(!host&&d.t==='s')Object.assign(S,d.S);};
  const left=()=>$('st').textContent='The other player left.';
  function begin(){
    if(started)return;started=true;
    $('st').textContent=host?'Connected. You are the LEFT paddle.':'Connected. You are the RIGHT paddle.';
    const [c,g]=mkCanvas($('cv'),600,400);
    loopGame(()=>{
      if(host){
        S.n1=myName();S.p1=Math.max(0,Math.min(320,S.p1+dirY()*6));S.p2=Math.max(0,Math.min(320,S.p2+in2*6));
        if(S.s1<7&&S.s2<7){
          S.bx+=S.bvx;S.by+=S.bvy;if(S.by<5||S.by>395)S.bvy*=-1;
          if(S.bvx<0&&S.bx<22&&S.bx>10&&S.by>S.p1&&S.by<S.p1+80){S.bvx=Math.min(10,-S.bvx*1.07);S.bvy+=(S.by-S.p1-40)/10;}
          if(S.bvx>0&&S.bx>578&&S.bx<590&&S.by>S.p2&&S.by<S.p2+80){S.bvx=Math.max(-10,-S.bvx*1.07);S.bvy+=(S.by-S.p2-40)/10;}
          if(S.bx<-10||S.bx>610){const l=S.bx<0;l?S.s2++:S.s1++;S.bx=300;S.by=200;S.bvx=l?4:-4;S.bvy=rnd(-3,3);}
        }
        try{conn.send({t:'s',S});}catch(e){}
      } else {try{conn.send({t:'i',d:dirY(),n:myName()});}catch(e){}}
      g.clearRect(0,0,600,400);g.fillStyle='#fff';
      g.fillRect(10,S.p1,10,80);g.fillRect(580,S.p2,10,80);g.beginPath();g.arc(S.bx,S.by,7,0,7);g.fill();
      g.font='bold 32px system-ui';g.fillText(S.s1,250,40);g.fillText(S.s2,330,40);
      g.font='14px system-ui';g.fillText(S.n1||'P1',30,24);g.textAlign='right';g.fillText(S.n2||'P2',570,24);g.textAlign='left';
      if(S.s1>=7||S.s2>=7)banner(g,(S.s1>=7)===host?'You win!':'You lose',600,400);
    });
  }
  $('h').onclick=()=>{
    host=true;const code=Math.random().toString(36).slice(2,6).toUpperCase();
    peer=new Peer('arcadehub-'+code);
    peer.on('open',()=>{$('st').textContent='Room code: '+code+'. Waiting for player 2...';});
    peer.on('error',e=>{$('st').textContent='Error: '+e.type+'. Click Host to try again.';});
    peer.on('connection',cn=>{conn=cn;cn.on('data',onData);cn.on('close',left);if(cn.open)begin();else cn.on('open',begin);});
  };
  $('j').onclick=()=>{
    const code=$('code').value.trim().toUpperCase();
    if(code.length<4){$('st').textContent='Enter the 4-letter code.';return;}
    peer=new Peer();
    peer.on('open',()=>{conn=peer.connect('arcadehub-'+code,{reliable:true});conn.on('data',onData);conn.on('open',begin);conn.on('close',left);});
    peer.on('error',e=>{$('st').textContent='Error: '+e.type;});
  };
}

/* ===== NEON SNAKE (WASD) ===== */
function neonSnake(el){
  const [c,g]=mkCanvas(el,480,480),N=20,Z=24;

  const put=()=>{do{ap={x:Math.random()*N|0,y:Math.random()*N|0};}while(sn.some(q=>q.x===ap.x&&q.y===ap.y));};
  loopGame(()=>{
    if(!dead){
      if(keys.KeyW&&d.y!==1)nd={x:0,y:-1};if(keys.KeyS&&d.y!==-1)nd={x:0,y:1};
      if(keys.KeyA&&d.x!==1)nd={x:-1,y:0};if(keys.KeyD&&d.x!==-1)nd={x:1,y:0};

    if(dead)banner(g,'Crashed! Close and reopen to retry',480,480);
  });
}

  loopGame(()=>{
    g.clearRect(0,0,600,500);
    if(!dead){
      s.a+=dirX()*.07;if(keys.KeyW){s.vx+=Math.cos(s.a)*.12;s.vy+=Math.sin(s.a)*.12;}
      s.vx*=.99;s.vy*=.99;s.x+=s.vx;s.y+=s.vy;wrap(s);
      if(cd>0)cd--;if(keys.Space&&cd<=0){bl.push({x:s.x,y:s.y,vx:Math.cos(s.a)*8+s.vx,vy:Math.sin(s.a)*8+s.vy,l:60});cd=12;}
      bl.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.l--;wrap(b);});bl=bl.filter(b=>b.l>0);
      rk.forEach(r=>{r.x+=r.vx;r.y+=r.vy;wrap(r);});
      for(const r of rk)for(const b of bl)if(Math.hypot(r.x-b.x,r.y-b.y)<r.r){b.l=0;r.hit=1;}
      const nr=[];
      rk.forEach(r=>{if(r.hit){sc+=r.r>20?10:20;if(r.r>20)for(let i=0;i<2;i++)nr.push({x:r.x,y:r.y,vx:rnd(-2.2,2.2),vy:rnd(-2.2,2.2),r:r.r/2});}else nr.push(r);});
      rk=nr;bl=bl.filter(b=>b.l>0);
      if(!rk.length){lvl++;spawn(4+lvl);}
      if(rk.some(r=>Math.hypot(r.x-s.x,r.y-s.y)<r.r+8)){dead=true;submitScore(sc);}
    }

    g.fillStyle='#facc15';bl.forEach(b=>g.fillRect(b.x-2,b.y-2,4,4));
    if(!dead){g.save();g.translate(s.x,s.y);g.rotate(s.a);g.strokeStyle='#22d3ee';g.beginPath();g.moveTo(14,0);g.lineTo(-10,-9);g.lineTo(-10,9);g.closePath();g.stroke();g.restore();}
    g.fillStyle='#fff';g.font='16px system-ui';g.fillText('Score '+sc+'   A/D turn, W thrust, Space fire',10,22);
    if(dead)banner(g,'Destroyed! Close and reopen to retry',600,500);

}

/* ===== MAZE RUNNER (WASD) ===== */
function maze(el){
  const [c,g]=mkCanvas(el,520,560),N=13,Z=40;
  let cells,px,py,lvl=0,time=0,cd=0,dead=false;
  function gen(){
    cells=Array.from({length:N*N},()=>({w:[1,1,1,1],v:0}));
    const st=[0];cells[0].v=1;
    while(st.length){
      const i=st[st.length-1],x=i%N,y=i/N|0,nb=[];
      if(y>0&&!cells[i-N].v)nb.push([i-N,0,2]);if(x<N-1&&!cells[i+1].v)nb.push([i+1,1,3]);
      if(y<N-1&&!cells[i+N].v)nb.push([i+N,2,0]);if(x>0&&!cells[i-1].v)nb.push([i-1,3,1]);
      if(!nb.length){st.pop();continue;}
      const [j,a,b]=nb[Math.random()*nb.length|0];cells[i].w[a]=0;cells[j].w[b]=0;cells[j].v=1;st.push(j);
    }
    px=0;py=0;time=Math.max(20,45-lvl*2)*60;
  }
  gen();
  loopGame(()=>{
    g.clearRect(0,0,520,560);
    if(!dead){
      if(cd>0)cd--;
      else{const w=cells[py*N+px].w;
        if(keys.KeyW&&!w[0]){py--;cd=5;}else if(keys.KeyD&&!w[1]){px++;cd=5;}
        else if(keys.KeyS&&!w[2]){py++;cd=5;}else if(keys.KeyA&&!w[3]){px--;cd=5;}}
      if(px===N-1&&py===N-1){lvl++;gen();}
      if(--time<=0){dead=true;submitScore(lvl*100);}
    }
    g.save();g.translate(0,36);
    g.strokeStyle='#64748b';g.lineWidth=3;g.beginPath();
    cells.forEach((cl,i)=>{const x=(i%N)*Z,y=(i/N|0)*Z;
      if(cl.w[0]){g.moveTo(x,y);g.lineTo(x+Z,y);}if(cl.w[1]){g.moveTo(x+Z,y);g.lineTo(x+Z,y+Z);}
      if(cl.w[2]){g.moveTo(x,y+Z);g.lineTo(x+Z,y+Z);}if(cl.w[3]){g.moveTo(x,y);g.lineTo(x,y+Z);}});
    g.stroke();
    g.fillStyle='#4ade80';g.fillRect((N-1)*Z+8,(N-1)*Z+8,Z-16,Z-16);
    g.fillStyle='#22d3ee';g.beginPath();g.arc(px*Z+Z/2,py*Z+Z/2,10,0,7);g.fill();
    g.restore();
    g.fillStyle='#fff';g.font='16px system-ui';g.fillText('Level '+(lvl+1)+'   Time '+Math.ceil(time/60)+'s   WASD',10,24);
    if(dead)banner(g,'Time up! Close and reopen to retry',520,560);
  });
}

/* ===== TILE MERGE (WASD slides, animated) ===== */
function tiles(el){
  const [c,g]=mkCanvas(el,420,480);
  let T=[],sc=0,over=false,on=false,anim=0;const AN=9;
  const at=(r,q)=>T.find(t=>!t.dead&&t.r===r&&t.c===q);
  function spawn(){
    const e=[];for(let r=0;r<4;r++)for(let q=0;q<4;q++)if(!at(r,q))e.push([r,q]);
    if(e.length){const [r,q]=e[Math.random()*e.length|0];T.push({v:Math.random()<.9?2:4,r,c:q,fr:r,fc:q,born:1,pop:0});}
  }
  const canMove=()=>{const L=T.filter(t=>!t.dead);if(L.length<16)return true;
    return L.some(t=>[[0,1],[1,0]].some(([a,b])=>{const u=at(t.r+a,t.c+b);return u&&u.v===t.v;}));};
  function slide(dir){
    T=T.filter(t=>!t.dead);T.forEach(t=>{t.fr=t.r;t.fc=t.c;t.born=0;t.pop=0;t.m=0;});
    const dr=[-1,0,1,0][dir],dc=[0,1,0,-1][dir];
    const ord=[...T].sort((a,b)=>dir===0?a.r-b.r:dir===2?b.r-a.r:dir===3?a.c-b.c:b.c-a.c);
    let moved=false;
    for(const t of ord){
      let r=t.r,q=t.c;
      for(;;){
        const nr=r+dr,nq=q+dc;if(nr<0||nq<0||nr>3||nq>3)break;
        const u=at(nr,nq);
        if(!u){r=nr;q=nq;continue;}
        if(u.v===t.v&&!u.m){u.v*=2;u.m=1;u.pop=1;sc+=u.v;t.dead=1;r=nr;q=nq;}
        break;
      }
      if(r!==t.r||q!==t.c)moved=true;t.r=r;t.c=q;
    }
    if(moved){spawn();anim=AN;if(!canMove()){over=true;submitScore(sc);}}
  }
  spawn();spawn();anim=AN;
  loopGame(()=>{
    const k=[keys.KeyW||keys.ArrowUp,keys.KeyD||keys.ArrowRight,keys.KeyS||keys.ArrowDown,keys.KeyA||keys.ArrowLeft].findIndex(Boolean);
    if(!over&&k>=0&&!on)slide(k);on=k>=0;
    if(anim>0)anim--;
    const p=1-anim/AN,e=1-Math.pow(1-p,3);
    g.fillStyle='#0c0f1a';g.fillRect(0,0,420,480);
    g.fillStyle='#fff';g.font='bold 20px system-ui';g.fillText('Score '+sc+'   WASD / arrows',16,36);
    g.fillStyle='#1e293b';for(let i=0;i<16;i++){g.beginPath();g.roundRect(18+(i%4)*98,70+(i/4|0)*98,90,90,18);g.fill();}
    [...T.filter(t=>t.dead),...T.filter(t=>!t.dead)].forEach(t=>{
      const x=18+(t.fc+(t.c-t.fc)*e)*98,y=70+(t.fr+(t.r-t.fr)*e)*98;
      let s=1;if(t.born)s=.3+.7*p;else if(t.pop)s=1+.18*Math.sin(p*Math.PI);
      g.save();g.translate(x+45,y+45);g.scale(s,s);
      g.fillStyle='hsl('+(190+Math.log2(t.v)*18)+' 70% 55%)';g.beginPath();g.roundRect(-45,-45,90,90,18);g.fill();
      g.fillStyle='#fff';g.font='bold '+(t.v>999?24:t.v>99?30:36)+'px system-ui';g.textAlign='center';g.fillText(t.v,0,13);g.textAlign='left';g.restore();
    });
    if(anim===0&&T.some(t=>t.dead))T=T.filter(t=>!t.dead);
    if(over)banner(g,'No moves left! Reopen to retry',420,480);
  });
}

/* ===== MINE SWEEP ===== */
function mines(el){
  const N=9,M=10,COL=['','#60a5fa','#4ade80','#f87171','#a78bfa','#fb923c','#22d3ee','#e5e7eb','#9ca3af'];
  let cells=[],started=false,done=false,t0=0,flags=0,flagMode=false;
  el.innerHTML='<div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px"><b id="mi"></b><b id="tm">⏱ 0</b><button class="btn" id="fm">🚩 Flag mode: off</button></div><div id="bd" style="display:grid;grid-template-columns:repeat(9,42px);gap:4px;justify-content:center"></div><p style="color:#9b9bab;font-size:.85rem">Tip: click a number whose flags match it to open the squares around it.</p></div>';
  const $=q=>el.querySelector(q),bd=$('#bd');
  const nb=i=>{const x=i%N,y=i/N|0,r=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if((dx||dy)&&X>=0&&Y>=0&&X<N&&Y<N)r.push(Y*N+X);}return r;};
  function paint(lost,won){
    cells.forEach(c=>{const b=c.b;b.textContent=c.r?(c.m?'💣':c.n||''):(c.f?'🚩':'');b.style.color=COL[c.n]||'#fff';b.style.background=c.r?(c.m?'#7f1d1d':'#1b1b23'):'#3a3a48';});
    $('#mi').textContent=lost?'💥 Boom! Press R to retry':won?'🎉 Cleared! Press R to play again':'💣 '+(M-flags);
  }
  function seed(safe){
    let k=0;const no=[safe,...nb(safe)];
    while(k<M){const i=Math.random()*N*N|0;if(!no.includes(i)&&!cells[i].m){cells[i].m=1;k++;}}
    cells.forEach((c,i)=>c.n=nb(i).filter(j=>cells[j].m).length);
  }
  function open(i){
    const st=[i];
    while(st.length){const j=st.pop(),d=cells[j];if(d.r||d.f)continue;d.r=1;if(d.m)return true;if(!d.n)nb(j).forEach(k=>st.push(k));}
    return false;
  }
  function finish(hit){
    if(hit){done=true;cells.forEach(x=>{if(x.m)x.r=1;});paint(true);return;}
    if(cells.filter(x=>x.r&&!x.m).length===N*N-M){done=true;submitScore(Math.max(10,1000-Math.floor((Date.now()-t0)/200)));paint(false,true);return;}
    paint();
  }
  function flag(i){if(done||cells[i].r)return;const c=cells[i];c.f^=1;flags+=c.f?1:-1;paint();}
  function click(i){
    if(done)return;const c=cells[i];
    if(flagMode&&!c.r){flag(i);return;}
    if(c.r){
      if(c.n&&nb(i).filter(j=>cells[j].f).length===c.n){let hit=false;nb(i).forEach(j=>{if(!cells[j].f&&open(j))hit=true;});finish(hit);}
      return;
    }
    if(c.f)return;
    if(!started){started=true;t0=Date.now();seed(i);}
    finish(open(i));
  }
  for(let i=0;i<N*N;i++){
    const b=document.createElement('button');
    b.style.cssText='height:42px;border:0;border-radius:12px;font-weight:700;font-size:1.05rem;cursor:pointer;background:#3a3a48';
    cells.push({b,m:0,r:0,f:0,n:0});bd.appendChild(b);
    b.onclick=()=>click(i);b.oncontextmenu=e=>{e.preventDefault();flag(i);};
  }
  $('#fm').onclick=()=>{flagMode=!flagMode;$('#fm').textContent='🚩 Flag mode: '+(flagMode?'on':'off');};
  timers.push(setInterval(()=>{if(started&&!done)$('#tm').textContent='⏱ '+Math.floor((Date.now()-t0)/1000);},500));
  paint();
}

function tanks(el){

  const pos=e=>{const r=c.getBoundingClientRect();m={x:(e.clientX-r.left)*640/r.width,y:(e.clientY-r.top)*480/r.height};};

      p.x=Math.max(16,Math.min(624,p.x+dirX()*3));p.y=Math.max(16,Math.min(464,p.y+dirY()*3));

        if(--e.cd<=0){eb.push({x:e.x,y:e.y,vx:Math.cos(e.a)*4.5,vy:Math.sin(e.a)*4.5,l:120});e.cd=rnd(90,150);}});
      bl.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.l--;});eb.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.l--;});
      for(const e of en)for(const b of bl)if(b.l>0&&Math.hypot(e.x-b.x,e.y-b.y)<18){b.l=0;e.hp--;}
      for(const b of eb)if(b.l>0&&Math.hypot(p.x-b.x,p.y-b.y)<16){b.l=0;p.hp-=10;}
      bl=bl.filter(b=>b.l>0);eb=eb.filter(b=>b.l>0);
      en=en.filter(e=>{if(e.hp<=0){sc+=20;return false;}if(Math.hypot(e.x-p.x,e.y-p.y)<22){p.hp-=15;return false;}return true;});
      if(p.hp<=0){dead=true;submitScore(sc);}
    }
    g.fillStyle='#f87171';g.strokeStyle='#f87171';g.lineWidth=5;
    en.forEach(e=>{g.beginPath();g.arc(e.x,e.y,15,0,7);g.fill();g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+Math.cos(e.a)*22,e.y+Math.sin(e.a)*22);g.stroke();});
    g.fillStyle='#facc15';bl.forEach(b=>g.fillRect(b.x-3,b.y-3,6,6));g.fillStyle='#fb923c';eb.forEach(b=>g.fillRect(b.x-3,b.y-3,6,6));
    if(!dead){const a=Math.atan2(m.y-p.y,m.x-p.x);g.fillStyle='#22d3ee';g.strokeStyle='#22d3ee';g.lineWidth=6;
      g.beginPath();g.arc(p.x,p.y,16,0,7);g.fill();g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+Math.cos(a)*26,p.y+Math.sin(a)*26);g.stroke();}
    g.fillStyle='#fff';g.font='16px system-ui';g.fillText('Score '+sc+'   Health '+Math.max(0,p.hp)+'   WASD, aim with mouse',10,22);
    if(dead)banner(g,'Destroyed! Close and reopen to retry',640,480);
  });
}

/* ===== GRAVITY FLIP (W / Space) ===== */
function gflip(el){
  const [c,g]=mkCanvas(el,600,360);
  let y=326,vy=0,gd=1,obs=[],t=0,prev=false,dead=false;
  loopGame(()=>{
    g.fillStyle='#0c0f1a';g.fillRect(0,0,600,360);
    const k=keys.KeyW||keys.Space||keys.KeyS||keys.ArrowUp;
    if(!dead){
      if(k&&!prev)gd*=-1;prev=k;
      vy+=gd*.7;y+=vy;
      if(y>326){y=326;vy=0;}if(y<34){y=34;vy=0;}
      t++;
      if(t%Math.max(34,78-(t/150|0)*4)===0)obs.push({x:620,top:Math.random()<.5,h:rnd(45,120)});
      const sp=5+t/900;obs.forEach(o=>o.x-=sp);obs=obs.filter(o=>o.x>-40);
      if(obs.some(o=>o.x<114&&o.x+30>86&&(o.top?y-14<20+o.h:y+14>340-o.h))){dead=true;submitScore(t/6);}
    }
    g.fillStyle='#334155';g.fillRect(0,0,600,20);g.fillRect(0,340,600,20);
    g.fillStyle='#f87171';obs.forEach(o=>g.fillRect(o.x,o.top?20:340-o.h,30,o.h));
    g.fillStyle='#22d3ee';g.fillRect(86,y-14,28,28);
    g.fillStyle='#fff';g.font='16px system-ui';g.fillText('Distance '+(t/6|0)+'m   W / Space flips gravity',10,50);
    if(dead)banner(g,'Crashed! Close and reopen to retry',600,360);
  });
}

/* ===== LANE CROSSER (WASD hops) ===== */
function lanes(el){
  const [c,g]=mkCanvas(el,396,484),Z=44,C=9;
  let px=4,py=10,best=10,sc=0,lvl=1,on=false,dead=false,cars=[];
  const mk=()=>{cars=[];for(let r=1;r<10;r++){if(r===5)continue;
    const d=r%2?1:-1,sp=(.7+lvl*.3+Math.random()*.7)*d,w=Z*(Math.random()<.35?2:1);
    for(let k=0;k<3;k++)cars.push({r,x:k*C*Z/3+rnd(0,40),sp,w,col:'hsl('+(Math.random()*360|0)+' 70% 55%)'});}};
  mk();
  loopGame(()=>{
    const k=['KeyW','KeyS','KeyA','KeyD'].find(x=>keys[x]);
    if(!dead){
      if(k&&!on){
        if(k==='KeyW')py--;else if(k==='KeyS')py=Math.min(10,py+1);else if(k==='KeyA')px=Math.max(0,px-1);else px=Math.min(C-1,px+1);
        if(py<best){best=py;sc+=10;}
        if(py<=0){sc+=50;lvl++;py=10;px=4;best=10;mk();}
      }
      on=!!k;
      cars.forEach(o=>{o.x+=o.sp;if(o.sp>0&&o.x>C*Z)o.x=-o.w;if(o.sp<0&&o.x<-o.w)o.x=C*Z;});
      if(cars.some(o=>o.r===py&&px*Z+Z-8>o.x&&px*Z+8<o.x+o.w)){dead=true;submitScore(sc);}
    }
    for(let r=0;r<11;r++){g.fillStyle=(r===0||r===5||r===10)?'#14532d':'#2b2b36';g.fillRect(0,r*Z,C*Z,Z);}
    cars.forEach(o=>{g.fillStyle=o.col;g.beginPath();g.roundRect(o.x,o.r*Z+6,o.w-4,Z-12,10);g.fill();});
    g.font='30px serif';g.textAlign='center';g.fillText('🐔',px*Z+Z/2,py*Z+Z-10);g.textAlign='left';
    g.fillStyle='#fff';g.font='bold 15px system-ui';g.fillText('Score '+sc+'   Level '+lvl+'   WASD',8,24);
    if(dead)banner(g,'Splat! Close and reopen to retry',396,484);
  });
}

/* ===== MOLE SMASH (click) ===== */
function moles(el){
  let sc=0,time=30,up=-1,over=false;
  el.innerHTML='<div><p id="mi" style="font-size:1.2rem"></p><div id="bd" style="display:grid;grid-template-columns:repeat(3,110px);gap:12px;justify-content:center"></div></div>';
  const mi=el.querySelector('#mi'),bd=el.querySelector('#bd'),hs=[];
  const draw=()=>{hs.forEach((h,i)=>{h.textContent=i===up?'🐹':'';h.style.background=i===up?'#3e91ff':'#2a2a35';});
    mi.textContent=over?'Time! Score '+sc+'. Press R to retry':'⏱ '+time+'s   Score '+sc;};
  for(let i=0;i<9;i++){
    const h=document.createElement('button');
    h.style.cssText='height:110px;border:0;border-radius:32px;font-size:3rem;cursor:pointer;background:#2a2a35';
    h.onclick=()=>{if(over)return;if(i===up){sc+=10;up=-1;}else sc=Math.max(0,sc-5);draw();};
    hs.push(h);bd.appendChild(h);
  }
  const pop=()=>{if(over)return;up=Math.random()*9|0;draw();setTimeout(()=>{if(!over){up=-1;draw();}},Math.max(420,850-sc*2));};
  timers.push(setInterval(pop,Math.max(600,1000)));
  timers.push(setInterval(()=>{if(over)return;time--;if(time<=0){over=true;up=-1;submitScore(sc);}draw();},1000));
  draw();pop();
}

/* ===== COLOR ECHO (W D S A or click) ===== */
function echo(el){
  const cols=['#ef4444','#3b82f6','#22c55e','#eab308'],kc=['KeyW','KeyD','KeyS','KeyA'],lab=['W','D','S','A'];
  let seq=[],inp=0,show=false,over=false,lvl=0;
  el.innerHTML='<div><p id="mi" style="font-size:1.2rem"></p><div id="pd" style="display:grid;grid-template-columns:repeat(2,120px);gap:14px;justify-content:center"></div></div>';
  const mi=el.querySelector('#mi'),pd=el.querySelector('#pd');
  const pads=cols.map((c,i)=>{const b=document.createElement('button');
    b.style.cssText='height:120px;border:0;border-radius:36px;font-size:2rem;font-weight:700;color:#fff;cursor:pointer;opacity:.5;transition:opacity .1s;background:'+c;
    b.textContent=lab[i];b.onclick=()=>press(i);pd.appendChild(b);return b;});
  const flash=(i,ms)=>{pads[i].style.opacity=1;setTimeout(()=>{pads[i].style.opacity=.5;},ms);};
  function next(){
    inp=0;lvl++;seq.push(Math.random()*4|0);show=true;mi.textContent='Watch...';
    seq.forEach((v,k)=>setTimeout(()=>flash(v,350),600+k*600));
    setTimeout(()=>{show=false;if(!over)mi.textContent='Your turn! Round '+lvl;},600+seq.length*600);
  }
  function press(i){
    if(show||over)return;flash(i,200);
    if(i!==seq[inp]){over=true;mi.textContent='Wrong! You reached round '+lvl+'. Press R to retry';submitScore((lvl-1)*10);return;}
    if(++inp===seq.length)setTimeout(next,700);
  }
  const kd=e=>{if(e.repeat)return;const i=kc.indexOf(e.code);if(i>=0)press(i);};
  document.addEventListener('keydown',kd);stops.push(()=>document.removeEventListener('keydown',kd));
  next();
}

/* ===== TIC TAC TOE (click, vs computer) ===== */
function ttt(el){
  let b=Array(9).fill(''),sc=0,over=false,lock=false;
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=(bd,p)=>L.some(l=>l.every(i=>bd[i]===p)),full=bd=>bd.every(Boolean);
  function mm(bd,p){
    if(win(bd,'O'))return 1;if(win(bd,'X'))return -1;if(full(bd))return 0;
    let best=p==='O'?-2:2;
    for(let i=0;i<9;i++)if(!bd[i]){bd[i]=p;const v=mm(bd,p==='O'?'X':'O');bd[i]='';best=p==='O'?Math.max(best,v):Math.min(best,v);}
    return best;
  }
  function ai(){
    const em=b.map((v,i)=>v?-1:i).filter(i=>i>=0);
    if(Math.random()<.25)return em[Math.random()*em.length|0];
    let bi=em[0],bs=-2;for(const i of em){b[i]='O';const v=mm(b,'X');b[i]='';if(v>bs){bs=v;bi=i;}}return bi;
  }
  el.innerHTML='<div><p id="mi" style="font-size:1.2rem"></p><div id="bd" style="display:grid;grid-template-columns:repeat(3,100px);gap:10px;justify-content:center"></div></div>';
  const mi=el.querySelector('#mi'),bd=el.querySelector('#bd'),cs2=[];
  const draw=m=>{cs2.forEach((c,i)=>{c.textContent=b[i];c.style.color=b[i]==='X'?'#3e91ff':'#ff6b6b';});mi.textContent=m;};
  const next=(m,pts)=>{sc+=pts;draw(m+' Score '+sc);lock=true;setTimeout(()=>{b=Array(9).fill('');lock=false;draw('Your turn (X). Score '+sc);},800);};
  for(let i=0;i<9;i++){
    const c=document.createElement('button');
    c.style.cssText='height:100px;border:0;border-radius:28px;background:#2a2a35;font-size:3rem;font-weight:700;cursor:pointer';
    c.onclick=()=>{
      if(over||lock||b[i])return;b[i]='X';
      if(win(b,'X')){next('You win this round! +30',30);return;}
      if(full(b)){next('Draw. +10',10);return;}
      b[ai()]='O';
      if(win(b,'O')){over=true;draw('You lost. Final score '+sc+'. Press R to retry');submitScore(sc);return;}
      if(full(b)){next('Draw. +10',10);return;}
      draw('Your turn (X). Score '+sc);
    };
    cs2.push(c);bd.appendChild(c);
  }
  draw('Your turn (X). Score 0');
}

/* ===== TYPING SPRINT ===== */
function typing(el){
  const W=['code','game','jump','fast','pixel','arcade','rocket','zombie','cookie','shield','dragon','laser','turbo','galaxy','wizard','magic','tiger','storm','robot','ninja','candy','frost','blaze','comet','vortex','pirate','crystal','thunder','shadow','phoenix'];
  let sc=0,time=30,word='',over=false;
  el.innerHTML='<div><p id="mi" style="font-size:1.1rem"></p><div id="wd" style="font-size:3rem;font-weight:700;margin:14px 0;letter-spacing:.05em"></div><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" style="padding:15px 20px;font-size:1.4rem;border-radius:999px;border:0;background:#25252f;color:#fff;text-align:center;outline:none;width:260px"><p style="color:#9b9bab">Type the word, then press Space or Enter</p></div>';
  const mi=el.querySelector('#mi'),wd=el.querySelector('#wd'),inp=el.querySelector('#in');
  const nextWord=()=>{word=W[Math.random()*W.length|0];wd.textContent=word;wd.style.color='#fff';inp.value='';};
  const upd=()=>{mi.textContent=over?'Time! '+sc/10+' words. Press R to retry':'⏱ '+time+'s   Words '+sc/10;};
  inp.onkeydown=e=>{if(over)return;if(e.key===' '||e.key==='Enter'){e.preventDefault();if(inp.value.trim()===word)sc+=10;nextWord();upd();}};
  inp.oninput=()=>{wd.style.color=word.startsWith(inp.value.trim())?'#fff':'#f87171';};
  timers.push(setInterval(()=>{if(over)return;time--;if(time<=0){over=true;inp.disabled=true;submitScore(sc);}upd();},1000));
  nextWord();upd();inp.focus();
}

/* ===== REACTION RUSH ===== */
function reaction(el){
  let n=0,times=[],state='idle',t0=0,to,over=false;
  el.innerHTML='<div><p id="mi" style="font-size:1.2rem"></p><button id="pad" style="width:min(80vw,360px);height:240px;border:0;border-radius:48px;font-size:1.6rem;font-weight:700;color:#fff;cursor:pointer"></button></div>';
  const pad=el.querySelector('#pad'),mi=el.querySelector('#mi');
  const set=(c,t)=>{pad.style.background=c;pad.textContent=t;};
  function arm(){state='wait';set('#dc2626','Wait for green...');mi.textContent='Round '+(n+1)+' of 5';
    to=setTimeout(()=>{state='go';t0=performance.now();set('#16a34a','CLICK!');},rnd(1200,3500));}
  pad.onclick=()=>{
    if(over)return;
    if(state==='idle')arm();
    else if(state==='wait'){clearTimeout(to);set('#475569','Too soon! Click to retry this round');state='idle';}
    else if(state==='go'){
      const ms=Math.round(performance.now()-t0);times.push(ms);n++;
      if(n>=5){over=true;const avg=Math.round(times.reduce((a,b)=>a+b)/5);set('#2563eb','Average '+avg+' ms. Press R to retry');mi.textContent='';submitScore(Math.max(10,1500-avg*3));}
      else{set('#2563eb',ms+' ms. Click for the next round');state='idle';}
    }
  };
  set('#2563eb','Click to start');
  stops.push(()=>clearTimeout(to));
}

/* ===== MEMORY MATCH ===== */
function memoryMatch(el){
  const icons=['🐧','🐸','🐙','🦊','🐼','🐵','🦄','🐢'];
  const cards=[...icons,...icons].sort(()=>Math.random()-.5);
  let first=null,lock=false,found=0,moves=0;
  el.innerHTML=`<div><p>Moves: <b id="m">0</b></p><div id="board" style="display:grid;grid-template-columns:repeat(4,70px);gap:10px;justify-content:center"></div></div>`;
  const board=el.querySelector('#board');
  cards.forEach(ic=>{
    const c=document.createElement('button');
    c.style.cssText='height:70px;font-size:2rem;border:0;border-radius:10px;background:#334155;cursor:pointer';
    c.dataset.icon=ic;c.textContent='?';
    c.onclick=()=>{
      if(lock||c.disabled||c===first)return;
      c.textContent=ic;c.style.background='#475569';
      if(!first){first=c;return;}
      moves++;el.querySelector('#m').textContent=moves;
      if(first.dataset.icon===ic){first.disabled=c.disabled=true;first=null;found++;
        if(found===icons.length)setTimeout(()=>{el.querySelector('p').innerHTML='🎉 You won in <b>'+moves+'</b> moves!';submitScore(Math.max(10,300-moves*10));},300);}
      else{lock=true;const a=first;first=null;
        setTimeout(()=>{a.textContent=c.textContent='?';a.style.background=c.style.background='#334155';lock=false;},700);}
    };
    board.appendChild(c);
  });
}
